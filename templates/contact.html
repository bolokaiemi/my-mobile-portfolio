{% extends "base.html" %}


{% block title %}
Contact | Ebi Emmerich-Adehor
{% endblock %}


{% block extra_css %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/contact.css') }}"
>

{% endblock %}


{% block content %}

<main class="page-container">


    <div class="page-card">


        <a
            href="{{ url_for('home') }}"
            class="back-button"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back

        </a>


        <div class="page-icon">

            <i class="fa-solid fa-envelope"></i>

        </div>


        <h1>
            Contact Me
        </h1>


        <p class="page-intro">

            Interested in working together?
            Send me a message.

        </p>


        <form
            class="contact-form"
            id="contactForm"
        >


            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="your@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="How can I help?"
                    required
                >

            </div>


            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Write your message..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-button"
            >

                <i class="fa-solid fa-paper-plane"></i>

                Send Message

            </button>


        </form>


        <div
            id="contactMessage"
            class="contact-message"
        ></div>


    </div>


</main>

{% endblock %}


{% block extra_js %}

<script
    src="{{ url_for('static', filename='js/contact.js') }}"
></script>

{% endblock %}
