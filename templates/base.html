<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        My Mobile Portfolio
        {% endblock %}
    </title>

 <style>
        @keyframes scrollUp {
          0% { transform: translateY(100%); }
          100% { transform: translateY(-100%); }
        }

        .scroll-container {
          height: 100vh;
          overflow: auto;
          position: relative;
        }


        #scroll-button{
            position: fixed;
            bottom: 1px;
            right: 25px;
            padding: 10px;
            font-size: 14px;
            width: 30px;
            height: 30px;
        }
        .skip-link {
    position: absolute;
    left: -10000px;
    top: auto;
}

.skip-link:focus {
    left: 1rem;
    top: 1rem;
    z-index: 10000;
}
    </style>

    <!-- Main CSS -->
<link rel="icon"
      href="{{ url_for('static', filename='images/favicon.ico') }}"
      type="image/x-icon">


    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/datenimpress.css') }}"
>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
     <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/certificate.css') }}"
    >
     <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/legal.css') }}"
    >


    <!-- Mobile Portfolio CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/mobile.css') }}"
    >


    <!-- Font Awesome 6 -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    {% block extra_css %}{% endblock %}

</head>


<body>

 <div class="scroll-container">
      <div class="scroll-content">

    {% block content %}

    {% endblock %}


    {% block extra_js %}{% endblock %}


<footer class="site-legal-footer">

    <a href="{{ url_for('impressum') }}">
        Impressum
    </a>

    <span aria-hidden="true">•</span>

    <a href="{{ url_for('datenschutz') }}">
        Datenschutz
    </a>

</footer>

</div>
</div>
<button id="scroll-button" type="button" aria-label="Scroll to top">
    ↑
</button>
</body>

</html>
